services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ottodot
      POSTGRES_PASSWORD: ottodot
      POSTGRES_DB: ottodot
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ottodot"]
      interval: 2s
      timeout: 3s
      retries: 20
